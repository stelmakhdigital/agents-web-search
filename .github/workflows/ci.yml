# Phase 6.1 CI: the adapters build against the core tarball built from the
# sibling core-web-search repository (dev mode: file:../../.vendor/*.tgz).
# Core is packed from the sibling checkout; pnpm install runs WITHOUT
# --frozen-lockfile because the rebuilt tarball changes the lockfile
# integrity pin (file: dependency). DSH typecheck:host is local-only
# (needs the full DSH checkout) and is not part of CI.
# GOTCHA (2026-09-21, actions/checkout v4, git-directory-helper.ts): a
# checkout into a path WITHOUT an existing `.git` (the remove=true branch
# of prepareExistingDirectory — NOT controlled by the `clean` flag) DELETES
# ALL existing contents of that path. Therefore the ROOT repo must be
# checked out FIRST (fresh workspace — nothing to lose); the sibling core
# repo SECOND, into the non-existing core-web-search/ subdirectory. The
# reverse order wipes core-web-search/ and setup-node fails with "Some
# specified paths were not resolved, unable to cache dependencies"
# (missing core-web-search/package-lock.json for cache-dependency-path).
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: core tarball + build + typecheck + test (dsh, pi, contract)
    runs-on: ubuntu-latest
    steps:
      # ORDER MATTERS — see the GOTCHA note above: root repo first, sibling
      # core repo second (into a fresh subdirectory).
      - name: Check out agents-web-search
        uses: actions/checkout@v4

      - name: Check out core-web-search (sibling, for the .vendor tarball)
        uses: actions/checkout@v4
        with:
          repository: stelmakhdigital/core-web-search
          path: core-web-search

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core-web-search/package-lock.json

      - name: Build the core tarball into .vendor/
        run: |
          cd core-web-search
          npm ci --no-audit --no-fund
          npm pack --pack-destination ../.vendor/ --no-audit --no-fund

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: "Install (no frozen lockfile — the file: tarball integrity pin is rebuilt)"
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test
